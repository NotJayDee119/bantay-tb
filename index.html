<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BANTAY-TB: GIS-based spatial surveillance and hotspot detection for Tuberculosis in Davao City." />
    <title>BANTAY-TB</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#061020" />
    <!-- First-visit loader. Shown while the app's JavaScript downloads, so a
         slow connection sees a spinner instead of a blank white page. React
         replaces everything inside #root on its first render. Matches
         LoadingSpinner (src/components/LazyFallback.tsx). -->
    <style>
      body { margin: 0; background: #f8fafc; }
      .boot-loader {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px; font-weight: 500; color: #64748b;
        opacity: 0; animation: boot-fade 0.2s ease-out 0.15s forwards;
      }
      .boot-loader svg { width: 32px; height: 32px; color: #486581; animation: boot-spin 1s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-fade { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot-loader svg { animation-duration: 2.5s; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" role="status" aria-live="polite">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" opacity="0.25" />
          <path fill="currentColor" opacity="0.75" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
        </svg>
        <span>Loading…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
